[project]
name = "rsrp-improvement-automated-pipeline"
version = "2.0.0"
description = "Enterprise-grade spatial optimization engine for detecting and resolving RSRP/RSRQ coverage holes at airport terminals"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src.*"]

[tool.setuptools.package-data]
"*" = ["*.py"]
